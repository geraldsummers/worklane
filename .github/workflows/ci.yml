name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt,llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo llvm-cov --workspace --fail-under-lines 90
      - run: bash -n scripts/lab-acceptance scripts/release-check
      - run: python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/tui_capture.py').read_text())"
      - run: shellcheck scripts/lab-acceptance scripts/release-check
