[package]
name = "worklane-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap.workspace = true
chrono.workspace = true
jsonwebtoken = "10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.2.0", features = ["transport-streamable-http-server"] }
schemars = "1.2"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.44", features = ["macros", "process", "rt-multi-thread", "signal"] }
uuid.workspace = true
